# Remap prefix from 'C-b' to 'C-a'
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# Start at index 1
set -g base-index 1

# Enable colors
set -g default-terminal "tmux-256color"
set -ga terminal-features ',xterm-256color:RGB'
set -ga terminal-overrides ',*256col*:Tc'

# Increase scroll back buffer size
set -g history-limit 100000

# Disable the delay between an escape key press and subsequent characters
set -s escape-time 0

# tmux messages are displayed for 4 seconds
set -g display-time 4000

# Automatically re-number windows after one of them is closed
set -g renumber-windows on

# Propagate focus events to applications inside tmux (e.g. nvim autoread)
set -g focus-events on

# Allow OSC 52 clipboard sequences to pass through to the outer terminal
set -g allow-passthrough on
# Enable OSC 52 clipboard integration so yanks reach the outer terminal
set -g set-clipboard on

# Mouse mode (tmux 2.1 and above)
set -g mouse off

# Don't notify in the status area when a window has activity
set -g monitor-activity off

# Vi movement keys
set -g status-keys vi

# Use vim keybindings in copy mode
setw -g mode-keys vi

# Resize a window based on the smallest client actually viewing it,
# not on the smallest one attached to the entire session.
setw -g aggressive-resize on

# Switch panes using Alt-arrow without prefix
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Split and Creating keeping the current directory
bind '%' split-window -h -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# Prefix + r -> Reload config file
unbind r
bind r source-file ~/.tmux.conf

# Begin selection in copy mode with 'v'
#bind -t vi-copy 'v' begin-selection # <2.4
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Swap windows with ctrl-shift-(left/right)
bind-key -n S-Left swap-window -t -1\; select-window -t -1
bind-key -n S-Right swap-window -t +1\; select-window -t +1

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'catppuccin/tmux#v2.3.0'

# Auto-install tpm and plugins.
if "test ! -d ~/.tmux/plugins/tpm -o ! -d ~/.tmux/plugins/tmux/.git" \
   "run '(test -d ~/.tmux/plugins/tpm || git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm) \
         && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Symlink custom gruvbox palette (v2: catppuccin_<flavor>_tmux.conf).
if "test -d ~/.tmux/plugins/tmux/themes" \
   "run 'ln -sfn ~/git/dot-files/.tmux/plugins/tmux/themes/catppuccin_gruvbox_tmux.conf \
              ~/.tmux/plugins/tmux/themes/catppuccin_gruvbox_tmux.conf'"

# Ressurect restores pane contents
set -g @resurrect-capture-pane-contents 'on'

# set catppuccin theme
set -g @catppuccin_flavor 'gruvbox'
# set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_status_module_text_bg "#{@thm_surface_0}"
set -g @catppuccin_window_current_number_color "#{@thm_peach}"
set -g @catppuccin_application_color "#{@thm_lavender}"
set -g @catppuccin_window_text " #{pane_current_command}"
set -g @catppuccin_window_current_text " #{pane_current_command}"
# Make the status line pretty and add some modules
run ~/.tmux/plugins/tmux/catppuccin.tmux
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"

# Continuum automatic restore
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep tpm before post-TPM status overrides)
run '~/.tmux/plugins/tpm/tpm'
