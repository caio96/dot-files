# Default starship config (used by zsh).
# Bash uses .config/starship-bash.toml (selected via STARSHIP_CONFIG in .bashrc)
# so the prompt character differs visually between shells.

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

# zsh prompt char: ➜ (visually distinct from bash's ❯)
[character]
success_symbol = "[➜](bold green)"
error_symbol   = "[➜](bold red)"

# Custom: container indicator when running inside a Docker container.
[custom.docker]
description = "Docker container indicator"
command = "echo 󰡨"
# command = "echo 🐳"
when = "test -f /.dockerenv"
style = "cyan"

# Custom: container indicator when inside an enroot container (IN_ENROOT=1).
[custom.enroot]
description = "Enroot container indicator (set IN_ENROOT=1)"
command = "echo 󰹦"
# command = "echo 🌱"
when = 'test -n "$IN_ENROOT"'
style = "green"

# -------------------------------------------------------------------------------------------------------------
# Nerd-font preset overrides: strip "via" / "on" / "took" words from module formats, while keeping the symbols.
# -------------------------------------------------------------------------------------------------------------

[shell]
fish_indicator = '󰈺 '
powershell_indicator = '_'
bash_indicator = '󱆃'
zsh_indicator = ''
style = 'cyan bold'
disabled = false

